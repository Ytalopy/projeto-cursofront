<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header class="cabeçalho-principal">

    </header>
    <main class="conteudo-login">
        <div class="cartao-login">
            <h2>Acessar Painel Inicial</h2>
            <p class="subtitulo-login">Digite seus dados:</p>
            <form action="#" method="post">
                <div class="campo-grupo">
                    <label for="campo-email">Digite seu email:</label>
                    <input 
                    type="email" 
                    id="campo-email" 
                    name="email" 
                    placeholder="Email" 
                    required>
                </div>
                <div class="campo-grupo"
                <label for="campo-senha">Digite sua senha:</label>
                <input 
                type="password" 
                id="campo-senha" 
                name="senha" 
                placeholder="Senha" 
                minlength="6" 
                required>
                </div>
            </form>

        </div>
    </main>
</body>
</html>
